name: Build & Release APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    env:
      RELEASE_BODY: |
        Automated release from push to master.

        Changes in this version:
        ${{ github.event.head_commit.message }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        id: sign_app
        run: |
          # 1. Create the keystore file from the secret
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/release.jks
          
          # 2. Find the unsigned APK built by Gradle
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $UNSIGNED_APK"
          
          # 3. Find the latest build tools to get apksigner
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner
          echo "Using apksigner from version: $BUILD_TOOLS_VERSION"
          
          # 4. Sign the APK
          $APKSIGNER sign \
            --ks app/release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/pulseid-release-signed.apk \
            "$UNSIGNED_APK"
          
          # 5. Export the path for the next step
          echo "signedReleaseFile=app/build/outputs/apk/release/pulseid-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          RELEASE_BODY_FILE="$(mktemp)"
          trap 'rm -f "$RELEASE_BODY_FILE"' EXIT
          printf '%s' "$RELEASE_BODY" > "$RELEASE_BODY_FILE"

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@${RELEASE_BODY_FILE}"

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${{ steps.sign_app.outputs.signedReleaseFile }}" \
            -F "caption=Release v1.0.${{ github.run_number }} APK"
