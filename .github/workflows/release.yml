name: Build & Release APK

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    env:
      RELEASE_BODY: |
        Automated release from push to master.

        Changes in this version:
        ${{ github.event.head_commit.message }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract Version
        id: ext_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Sign APK
        id: sign_app
        run: |
          # 1. Create the keystore file from the secret
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/release.jks
          
          # 2. Find the unsigned APK built by Gradle
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $UNSIGNED_APK"
          
          # 3. Find the latest build tools to get apksigner
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner
          echo "Using apksigner from version: $BUILD_TOOLS_VERSION"
          
          # 4. Sign the APK
          $APKSIGNER sign \
            --ks app/release.jks \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/pulseid-release-signed.apk \
            "$UNSIGNED_APK"
          
          # 5. Export the path for the next step
          echo "signedReleaseFile=app/build/outputs/apk/release/pulseid-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tag_name: v${{ steps.ext_version.outputs.VERSION_NAME }}
          name: Release v${{ steps.ext_version.outputs.VERSION_NAME }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          set -euo pipefail

          CAPTION_FILE="$(mktemp)"
          trap 'rm -f "$CAPTION_FILE"' EXIT
          printf 'Release v${{ steps.ext_version.outputs.VERSION_NAME }}\n\n%s' "$RELEASE_BODY" > "$CAPTION_FILE"

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${{ steps.sign_app.outputs.signedReleaseFile }}" \
            -F "caption=<$CAPTION_FILE"

      - name: Upload APK to Backend
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          set -euo pipefail
          
          # Extract Version Code directly from Gradle
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | awk '{print $NF}')
          VERSION_NAME=${{ steps.ext_version.outputs.VERSION_NAME }}
          
          echo "Uploading v$VERSION_NAME ($VERSION_CODE) to backend..."
          
          curl --fail \
            -H "X-RELEASE-KEY: $RELEASE_KEY" \
            -F "platform=android" \
            -F "released_file=@${{ steps.sign_app.outputs.signedReleaseFile }}" \
            -F "version_code=$VERSION_CODE" \
            -F "version_name=$VERSION_NAME" \
            https://pulseid.teamsabily.online/api/app/release
